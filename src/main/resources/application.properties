spring.application.name=travelmanager

# ===============================
# JPA & Hibernate
# ===============================
# validate: Hibernate chỉ ĐỐI CHIẾU entity với schema, không tự sửa bảng.
# Đây là mặc định đúng cho bản đang chạy thật — 'update' có thể âm thầm đổi/khoá bảng
# khi entity thay đổi, và không bao giờ xoá cột thừa nên schema trôi dần không kiểm soát.
#
# KHI THÊM/ĐỔI CỘT TRONG ENTITY: chạy một lần với JPA_DDL_AUTO=update để Hibernate tạo cột,
# xác nhận bằng DESCRIBE <bảng>, rồi bỏ biến đó đi để quay lại validate.
#   docker compose run --rm -e JPA_DDL_AUTO=update backend
# Nếu app không khởi động được với validate, đó là dấu hiệu schema DB đang lệch entity —
# đọc log Hibernate để biết cột nào thiếu, đừng đổi vĩnh viễn sang update để né lỗi.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# Tắt mặc định: show-sql in cả dữ liệu người dùng ra log container, mà log này đang chạy public.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ===============================
# Database
# ===============================
# connectionTimeZone=UTC + preserveInstants=true: cột thời gian luôn lưu/đọc theo UTC,
# độc lập với giờ mặc định của JVM. Cần thiết vì TravelManagerApplication đặt giờ mặc
# định là Asia/Ho_Chi_Minh cho nghiệp vụ — không ghim ở đây thì driver sẽ hiểu lại toàn
# bộ createdAt cũ theo GMT+7 và mọi mốc thời gian đã lưu bị lệch đi 7 tiếng.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travelmanager?connectionTimeZone=UTC&preserveInstants=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JWT
# ===============================
jwt.secret.key=${JWT_SECRET}

# ===============================
# Server
# ===============================
server.port=8081
server.servlet.context-path=/api/v1
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.cookie.secure=${APP_COOKIE_SECURE:false}

# ===============================
# File Upload
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-parameter-count=10000
logging.level.org.springframework.web.multipart=${MULTIPART_LOG_LEVEL:WARN}
logging.level.org.apache.tomcat.util.http.fileupload=${MULTIPART_LOG_LEVEL:WARN}

# ===============================
# Mail
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

# ===============================
# VNPay
# ===============================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
app.admin.email=${ADMIN_EMAIL:admin@travelmanager.com}


spring.config.import=optional:file:.env[.properties]

# ===============================
# Google API
# ===============================
google.oauth2.client-id=${GOOGLE_API_CLIENT_ID}
google.places.api-key=${GOOGLE_PLACES_API_KEY}

# OpenTripMap — dùng cho backfill dữ liệu tham khảo (ảnh/mô tả), free, không cần billing
opentripmap.api-key=${OPENTRIPMAP_API_KEY:}